<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SplitLedger</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">

<div class="card shadow-sm border-0 p-4" style="max-width: 400px; width: 100%;">
    <div class="text-center mb-4">
        <h3 class="fw-bold mb-1">⚡ SPLITLEDGER</h3>
        <span class="text-muted small">Sign in to your account</span>
    </div>

    <!-- Error message -->
    <div th:if="${param.error}" class="alert alert-danger py-2 small" role="alert">
        Invalid email or password.
    </div>

    <!-- Logout message -->
    <div th:if="${param.logout}" class="alert alert-success py-2 small" role="alert">
        You have been logged out successfully.
    </div>

    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label class="form-label small fw-semibold">Email Address</label>
            <input type="email" name="email" class="form-control" placeholder="name@domain.com" required autofocus>
        </div>
        <div class="mb-3">
            <label class="form-label small fw-semibold">Password</label>
            <input type="password" name="password" class="form-control" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 fw-semibold py-2">Sign In</button>
    </form>
</div>

</body>
</html>
