<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - SplitLedger</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">

<div class="card shadow-sm border-0 p-4" style="max-width: 420px; width: 100%;">
    <div class="text-center mb-4">
        <h3 class="fw-bold mb-1">⚡ SPLITLEDGER</h3>
        <span class="text-muted small">Create a new member account</span>
    </div>

    <!-- Duplicate error message -->
    <div th:if="${error}" class="alert alert-danger py-2 small" role="alert" th:text="${error}"></div>

    <form th:action="@{/register}" method="post">
        <div class="mb-3">
            <label class="form-label small fw-semibold">Full Name</label>
            <input type="text" name="name" class="form-control" placeholder="John Doe" required autofocus>
        </div>
        <div class="mb-3">
            <label class="form-label small fw-semibold">Email Address</label>
            <input type="email" name="email" class="form-control" placeholder="name@domain.com" required>
        </div>
        <div class="mb-3">
            <label class="form-label small fw-semibold">Password</label>
            <input type="password" name="password" class="form-control" placeholder="••••••••" required minlength="6">
        </div>
        <div class="mb-3">
            <label class="form-label small fw-semibold">UPI ID (Optional)</label>
            <input type="text" name="upiId" class="form-control" placeholder="name@oksbi">
        </div>
        <button type="submit" class="btn btn-primary w-100 fw-semibold py-2">Create Account</button>
    </form>

    <div class="text-center mt-3">
        <span class="small text-muted">Already have an account? </span>
        <a th:href="@{/login}" class="small text-decoration-none">Sign in</a>
    </div>
</div>

</body>
</html>
