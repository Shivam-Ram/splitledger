spring.application.name=app

# Port (Cloud providers like Railway/Render assign PORT automatically)
server.port=${PORT:9091}

# Database Connection (Fallback to local if env variables not found)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/split_ledger_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf caching disabled for development/instant updates
spring.thymeleaf.cache=false